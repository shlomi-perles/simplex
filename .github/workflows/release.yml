name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish, for example manim-simplex-v0.3.0
        required: false

permissions:
  contents: read

jobs:
  release-please:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tag_name == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event.inputs.tag_name != '') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/manim-simplex
    permissions:
      contents: read
      id-token: write
    env:
      TEMPLATE_UPDATE_TOKEN: ${{ secrets.TEMPLATE_UPDATE_TOKEN }}
      TAG_NAME: ${{ github.event.inputs.tag_name || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended \
                                  ffmpeg libcairo2-dev libpango1.0-dev

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Pin Python
        run: uv python pin 3.13

      - name: Refresh lock metadata
        run: uv lock

      - name: Sync
        run: uv sync --locked --all-extras

      - name: Derive release version
        id: release-version
        run: |
          version="${TAG_NAME##*-v}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}([a-zA-Z0-9.-]+)?$ ]]; then
            echo "Could not derive a package version from tag '${TAG_NAME}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: README structure
        run: python tools/check_readmes.py

      - name: Lint
        run: uv run --locked ruff check .

      - name: Format check
        run: uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked basedpyright

      - name: Tests
        run: uv run --locked pytest -q

      - name: Vendor web assets
        run: uv run --locked python tools/vendor_web_assets.py

      - name: Build distributions
        run: uv build --clear --no-sources

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Publish distributions to PyPI
        run: uv publish

      - name: Dispatch template update
        if: ${{ env.TEMPLATE_UPDATE_TOKEN != '' }}
        env:
          SIMPLEX_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TEMPLATE_UPDATE_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/shlomi-perles/simplex-lectures-template/dispatches \
            -d "{\"event_type\":\"manim-simplex-release\",\"client_payload\":{\"tag\":\"${TAG_NAME}\",\"version\":\"${SIMPLEX_VERSION}\"}}"
