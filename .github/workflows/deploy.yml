name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SIMPLEX_GA_TAG: ${{ secrets.GA_TAG }}
      SIMPLEX_BASE_URL: ${{ vars.SIMPLEX_BASE_URL || '/' }}
      SIMPLEX_PREVIEW: '0'
    steps:
    - uses: actions/checkout@v6
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended \
                                ffmpeg libcairo2-dev libpango1.0-dev
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
    - name: Sync
      run: uv sync --locked
    - name: Cache manim render output
      uses: actions/cache@v5
      with:
        path: |
          site/decks/*/media
          ~/.cache/uv
        key: simplex-media-${{ hashFiles('uv.lock', 'decks/**/deck.toml', 'decks/**/slides/**/*.py', 'decks/**/slides.py', 'decks/**/manim.cfg', 'src/simplex/**/*.py') }}
        restore-keys: |
          simplex-media-
    - name: Build site
      run: uv run --locked simplex build
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: site
    - id: deploy
      uses: actions/deploy-pages@v5
