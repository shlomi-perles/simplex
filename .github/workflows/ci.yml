name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shlomi-perles/manim-simplex
          path: ../manim-simplex
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended \
                                  ffmpeg libcairo2-dev libpango1.0-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync
        run: uv sync
      - name: README structure
        run: python tools/check_readmes.py
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run basedpyright
      - name: Tests
        run: uv run pytest -q
      - name: Render smoke (showcase, last-frame only)
        run: uv run simplex test --only showcase
