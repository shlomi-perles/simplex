[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.5",
  "syrupy>=4.6",
  "ruff>=0.6",
  "basedpyright>=1.13",
  "pre-commit>=3.7",
]

[project]
authors = [{name = "Shlomi Perles"}]
dependencies = [
  "manim-simplex>=0.2.0",
  "manim-slides>=5.1.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "pygments>=2.18",
  "platformdirs>=4.2",
  "tomli-w>=1.0",
  "watchfiles>=0.24",
  # Already transitive via manim, but the thumbnail extractor imports them
  # directly so we pin them here too.
  "av>=15.0",
  "pillow>=11.0",
]
description = "Manim-slides presentation framework with a generated web portal."
license = {text = "MIT"}
# PyPI distribution name. The import name stays ``simplex`` (a PEP 420
# namespace shared with ``manim-simplex``); only the wheel/sdist on PyPI
# carries the ``-py`` suffix because the bare ``simplex`` slot is taken.
name = "simplex-py"
readme = "README.md"
requires-python = ">=3.13"
version = "0.2.0"

[project.scripts]
simplex = "simplex.cli.commands:app"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
# Manim's 0.20.x type stubs are incomplete; mirror the same softening as
# manim-simplex so this repo's CI passes for the same upstream reasons.
reportArgumentType = "warning"
reportAssignmentType = "warning"
# manim-slides converters (PDF, PowerPoint, RevealJS) are Pydantic models
# with sensible defaults the stubs don't expose; reportCallIssue fires on
# every conversion call. Demote.
reportCallIssue = "warning"
reportInconsistentConstructor = "warning"
reportMissingTypeStubs = false
reportPrivateUsage = false
reportReturnType = "warning"
reportUnknownArgumentType = false
reportUnknownLambdaType = "warning"
reportUnknownMemberType = false
reportUnknownVariableType = false
typeCheckingMode = "strict"

[tool.hatch.build.targets.wheel]
# Ship the deck template (and its hidden .gitkeep placeholders) inside the
# wheel so ``simplex new`` works from any user project, not just the simplex
# checkout. Hatchling otherwise drops dotfiles by default.
artifacts = [
  "src/simplex/deck/_template/**/*",
  "src/simplex/deck/_template/**/.gitkeep",
]
packages = ["src/simplex"]

[tool.hatch.build.targets.wheel.shared-data]
"src/simplex/web/static" = "simplex/web/static"
"src/simplex/web/templates" = "simplex/web/templates"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
