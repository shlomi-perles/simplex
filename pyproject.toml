[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.5",
  "syrupy>=4.6",
  "ruff>=0.6",
  "basedpyright>=1.13",
  "pre-commit>=3.7",
]

[project]
authors = [{name = "Shlomi Perles"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  # Manim authoring/plugin layer.
  "manim>=0.20.1",
  "manim-slides>=5.1.7",
  "pydantic>=2.7",
  "pygments>=2.18",
  "pymupdf>=1.27.2.3",
  # CLI, deck discovery, render orchestration, and static portal.
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "platformdirs>=4.2",
  "tomli-w>=1.0",
  "watchfiles>=0.24",
  # Already transitive via manim, but the thumbnail extractor imports them
  # directly so we pin them here too.
  "av>=15.0",
  "pillow>=11.0",
]
description = "Manim plugin and lecture-site CLI for Simplex presentations."
keywords = [
  "manim",
  "manim-slides",
  "animation",
  "presentation",
  "lecture",
  "education",
  "math",
  "computer-science",
  "static-site",
]
license = "MIT"
license-files = ["LICENSE"]
name = "manim-simplex"
readme = "README.md"
requires-python = ">=3.13"
version = "0.3.0"

[project.entry-points."manim.plugins"]
simplex = "simplex.plugin:activate"

[project.scripts]
simplex = "simplex.cli.commands:app"

[project.urls]
Changelog = "https://github.com/shlomi-perles/simplex/blob/main/CHANGELOG.md"
Homepage = "https://github.com/shlomi-perles/simplex"
Issues = "https://github.com/shlomi-perles/simplex/issues"
Repository = "https://github.com/shlomi-perles/simplex"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
# Manim's type stubs in 0.20.x are incomplete: VGroup(...) widens to
# `Group | Unknown`, Animation subclasses' `__init__` deliberately differs
# from the inherited `__new__`, color constants are `ManimColor` instances
# typed as `str`. Demote these categories to warnings rather than rewriting
# upstream's stubs in this plugin. Tracked for cleanup as stubs improve.
reportArgumentType = "warning"
reportAssignmentType = "warning"
# manim-slides converters (PDF, PowerPoint, RevealJS) are Pydantic models
# with sensible defaults the stubs don't expose; reportCallIssue fires on
# every conversion call. Demote.
reportCallIssue = "warning"
reportInconsistentConstructor = "warning"
reportMissingTypeStubs = false
# Tests deliberately exercise private helpers (e.g. `_resolve_section_type`,
# `_interpret_delay`) to keep the public surface small while still
# covering edge cases.
reportPrivateUsage = false
reportReturnType = "warning"
reportUnknownArgumentType = false
reportUnknownLambdaType = "warning"
reportUnknownMemberType = false
reportUnknownVariableType = false
typeCheckingMode = "strict"

[tool.hatch.build.targets.sdist]
artifacts = [
  "src/simplex/web/static/fonts/**/*",
  "src/simplex/web/static/htmx.min.js",
  "src/simplex/web/static/katex/**/*",
  "src/simplex/web/static/reveal.js/**/*",
  "src/simplex/web/static/tailwind.css",
]
exclude = [
  "/.claude",
  "/.github",
  "/media",
]

[tool.hatch.build.targets.wheel]
# Ship the deck template and vendored runtime assets inside the wheel so
# ``simplex new`` and ``simplex build`` work from installed environments.
# Hatchling otherwise drops ignored files and dotfile placeholders by default.
artifacts = [
  "src/simplex/deck/_template/**/*",
  "src/simplex/deck/_template/**/.gitkeep",
  "src/simplex/web/static/fonts/**/*",
  "src/simplex/web/static/htmx.min.js",
  "src/simplex/web/static/katex/**/*",
  "src/simplex/web/static/reveal.js/**/*",
  "src/simplex/web/static/tailwind.css",
]
packages = ["src/simplex"]

[tool.hatch.build.targets.wheel.force-include]
"src/simplex/py.typed" = "simplex/py.typed"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
