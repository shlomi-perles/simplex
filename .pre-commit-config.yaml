repos:
  - repo: local
    hooks:
      - id: check-readmes
        name: Every package directory has a README <= 50 lines
        entry: python tools/check_readmes.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
