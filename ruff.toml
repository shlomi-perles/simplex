extend-exclude = [".claude/"]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py313"

[format]
indent-style = "space"
quote-style = "double"

[lint]
ignore = [
  "E501",  # line length: handled by formatter, soft cap
  "S101",  # asserts ok in tests
]
select = [
  "E",
  "W",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "B",  # bugbear
  "UP",  # pyupgrade
  "SIM",  # simplify
  "TID",  # tidy imports
  "PTH",  # use pathlib
  "RUF",  # ruff
  "S",  # bandit (security)
  "PT",  # pytest style
  "C4",  # comprehensions
  "DTZ",  # datetime tz
  "T20",  # no print
  "FA",  # future-annotations (banned via UP)
]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.isort]
known-first-party = ["simplex"]

[lint.per-file-ignores]
"decks/**/slides.py" = ["E402", "F401", "F403", "F405", "N801", "N802", "N803", "N806", "I001", "PLR2004", "T201", "S101"]
"decks/**/slides/**/*.py" = ["E402", "F401", "F403", "F405", "N801", "N802", "N803", "N806", "I001", "PLR2004", "T201", "S101"]
"examples/**/*.py" = ["T20"]
"src/simplex/cli/**/*.py" = ["T20", "S603", "S607", "PT028"]
"src/simplex/deck/_template/**/*.py" = ["E402", "F401", "F403", "F405", "N801", "N802", "N803", "N806", "I001", "PLR2004", "T201", "S101"]
"src/simplex/render/**/*.py" = ["S603", "S607"]
"tests/**/*.py" = ["S101", "T20"]
"tools/**/*.py" = ["T20"]
