target-version = "py313"
line-length = 100
src = ["src", "tests", "tools"]

[lint]
select = [
  "E", "W",       # pycodestyle
  "F",            # pyflakes
  "I",            # isort
  "N",            # pep8-naming
  "B",            # bugbear
  "UP",           # pyupgrade
  "SIM",          # simplify
  "TID",          # tidy imports
  "PTH",          # use pathlib
  "RUF",          # ruff
  "S",            # bandit (security)
  "PT",           # pytest style
  "C4",           # comprehensions
  "DTZ",          # datetime tz
  "T20",          # no print
  "FA",           # future-annotations (banned via UP)
]
ignore = [
  "E501",         # line length: handled by formatter, soft cap
  "S101",         # asserts ok in tests
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]
"tools/**/*.py" = ["T20"]
# CLI also shells out (git, gh) and exposes a Typer subcommand named `test`
# which trips PT028's "test fn with default arg" heuristic.
"src/simplex/cli/**/*.py" = ["T20", "S603", "S607", "PT028"]
# subprocess.run() with a non-literal arg list is intentional in the render pipeline.
"src/simplex/render/**/*.py" = ["S603", "S607"]
# Deck authors write vanilla Manim and rough exploratory code; relax the
# strict style there so the framework's rules don't bleed into user content.
# The bundled deck template ships as package data but is authored in the same
# style, so it gets the same relaxed rules.
"decks/**/slides.py" = ["E402", "F401", "F403", "F405", "N801", "N802", "N803", "N806", "I001", "PLR2004", "T201", "S101"]
"decks/**/slides/**/*.py" = ["E402", "F401", "F403", "F405", "N801", "N802", "N803", "N806", "I001", "PLR2004", "T201", "S101"]
"src/simplex/deck/_template/**/*.py" = ["E402", "F401", "F403", "F405", "N801", "N802", "N803", "N806", "I001", "PLR2004", "T201", "S101"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.isort]
known-first-party = ["simplex"]

[format]
quote-style = "double"
indent-style = "space"
